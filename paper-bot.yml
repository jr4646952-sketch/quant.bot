# Runs the paper-trading bot every 5 minutes on GitHub's servers (your PC can be off).
# Paper money only — it never connects to a broker.
name: paper-bot

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay runs by a few minutes when busy)
  workflow_dispatch:        # lets you press "Run workflow" by hand

permissions:
  contents: write           # needed to save state/bot.json back to the repo

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bot
        env:
          SYMBOL: "MNQ=F"
          TIMEFRAME: "15m"
          START_CASH: "10000"
        run: python bot/cloud_bot.py
      - name: Save bot state
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add state/bot.json
          git diff --cached --quiet || git commit -m "bot update [skip ci]"
          git pull --rebase --autostash || true
          git push
